<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050203">
    <title>Blasphemous Knight</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #1a0606 0%, #050203 75%);
      }

      /* Mantém a proporção 16:9 e ocupa o máximo da janela. */
      canvas {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Blasphemous Knight">
      Seu navegador não oferece suporte ao canvas.
    </canvas>

    <!-- Scripts comuns (não módulos), em ordem de dependência: abre com duplo clique. -->
    <script src="src/core.js"></script>
    <script src="src/input.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/sprites.js"></script>
    <script src="src/story.js"></script>
    <script src="src/levels.js"></script>
    <script src="src/world.js"></script>
    <script src="src/entities.js"></script>
    <script src="src/render.js"></script>
    <script src="src/game.js"></script>
  </body>
</html>
